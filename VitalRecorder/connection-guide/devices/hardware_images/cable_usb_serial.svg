<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180" font-family="Arial, sans-serif">
  <rect width="520" height="180" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">USB-Serial Converter (Recommended: Netmate 4-port)</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#64748b">Creates a virtual COM port on the PC — acts as a Direct Cable</text>

  <!-- USB-A plug (left) -->
  <rect x="25" y="72" width="50" height="36" rx="3" fill="#1e293b"/>
  <rect x="30" y="77" width="40" height="26" rx="2" fill="#64748b"/>
  <rect x="33" y="80" width="34" height="8" rx="1" fill="#94a3b8"/>
  <rect x="33" y="91" width="34" height="8" rx="1" fill="#94a3b8"/>
  <text x="50" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">USB-A</text>
  <text x="50" y="139" text-anchor="middle" font-size="9" fill="#64748b">→ to PC</text>

  <!-- Cable -->
  <rect x="75" y="83" width="130" height="14" rx="3" fill="#475569"/>
  <line x1="75" y1="87" x2="205" y2="87" stroke="#64748b" stroke-width="2"/>
  <line x1="75" y1="93" x2="205" y2="93" stroke="#334155" stroke-width="2"/>

  <!-- Converter box -->
  <rect x="205" y="55" width="140" height="70" rx="8" fill="#1e40af"/>
  <text x="275" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="white">USB → Serial</text>
  <text x="275" y="97" text-anchor="middle" font-size="10" fill="#bfdbfe">Converter</text>
  <text x="275" y="112" text-anchor="middle" font-size="9" fill="#93c5fd">(virtual COM port)</text>

  <!-- LED indicator dots -->
  <circle cx="220" cy="66" r="4" fill="#22c55e"/>
  <circle cx="232" cy="66" r="4" fill="#f59e0b"/>

  <!-- Cable right -->
  <rect x="345" y="83" width="60" height="14" rx="3" fill="#475569"/>

  <!-- DB-9 Male connector (right) -->
  <polygon points="405,58 500,58 510,128 395,128" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="417" cy="93" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="488" cy="93" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <!-- Pins row 1 -->
  <circle cx="428" cy="79" r="4" fill="#475569"/>
  <circle cx="442" cy="79" r="4" fill="#475569"/>
  <circle cx="456" cy="79" r="4" fill="#475569"/>
  <circle cx="470" cy="79" r="4" fill="#475569"/>
  <circle cx="484" cy="79" r="4" fill="#475569"/>
  <!-- Pins row 2 -->
  <circle cx="435" cy="103" r="4" fill="#475569"/>
  <circle cx="449" cy="103" r="4" fill="#475569"/>
  <circle cx="463" cy="103" r="4" fill="#475569"/>
  <circle cx="477" cy="103" r="4" fill="#475569"/>
  <text x="452" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">DB-9M</text>
  <text x="452" y="159" text-anchor="middle" font-size="9" fill="#64748b">→ to Device Cable</text>

  <!-- Note -->
  <rect x="80" y="165" width="360" height="14" rx="4" fill="#dbeafe"/>
  <text x="260" y="175" text-anchor="middle" font-size="10" fill="#1e40af">Acts as direct cable — cross-gender adapter still needed for cross-wired devices</text>
</svg>
