<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" font-family="Arial, sans-serif">
  <rect width="560" height="180" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Direct Serial Cable</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#64748b">Pin 2 ↔ Pin 2 (Rx) &nbsp;|&nbsp; Pin 3 ↔ Pin 3 (Tx) &nbsp;|&nbsp; Pin 5 ↔ Pin 5 (GND)</text>

  <!-- LEFT CONNECTOR: DB-9 Female (device side) -->
  <!-- Trapezoid shell -->
  <polygon points="30,55 125,55 130,125 25,125" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <!-- Screw holes -->
  <circle cx="42" cy="90" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="113" cy="90" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <!-- Pin holes: row 1 (5 holes) -->
  <circle cx="53" cy="76" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="67" cy="76" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="81" cy="76" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="95" cy="76" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="109" cy="76" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Pin holes: row 2 (4 holes) -->
  <circle cx="60" cy="100" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="74" cy="100" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="88" cy="100" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="102" cy="100" r="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Label -->
  <text x="78" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">DB-9 Female</text>
  <text x="78" y="160" text-anchor="middle" font-size="10" fill="#64748b">(Device side)</text>

  <!-- CABLE LINE -->
  <rect x="130" y="83" width="300" height="14" fill="#94a3b8" rx="3"/>
  <!-- Wire color hints -->
  <rect x="130" y="85" width="300" height="4" fill="#64748b" rx="2"/>
  <rect x="130" y="91" width="300" height="4" fill="#475569" rx="2"/>

  <!-- RIGHT CONNECTOR: DB-9 Male (PC/converter side) -->
  <polygon points="430,55 525,55 535,125 420,125" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <!-- Screw holes -->
  <circle cx="442" cy="90" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="513" cy="90" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>
  <!-- Pins (filled): row 1 (5 pins) -->
  <circle cx="453" cy="76" r="4" fill="#475569"/>
  <circle cx="467" cy="76" r="4" fill="#475569"/>
  <circle cx="481" cy="76" r="4" fill="#475569"/>
  <circle cx="495" cy="76" r="4" fill="#475569"/>
  <circle cx="509" cy="76" r="4" fill="#475569"/>
  <!-- Pins: row 2 (4 pins) -->
  <circle cx="460" cy="100" r="4" fill="#475569"/>
  <circle cx="474" cy="100" r="4" fill="#475569"/>
  <circle cx="488" cy="100" r="4" fill="#475569"/>
  <circle cx="502" cy="100" r="4" fill="#475569"/>
  <!-- Label -->
  <text x="481" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">DB-9 Male</text>
  <text x="481" y="160" text-anchor="middle" font-size="10" fill="#64748b">(PC/Converter side)</text>

  <!-- Use note -->
  <rect x="140" y="165" width="280" height="14" rx="4" fill="#dcfce7"/>
  <text x="280" y="175" text-anchor="middle" font-size="10" fill="#15803d">✔ Used for most devices — default cable choice</text>
</svg>
