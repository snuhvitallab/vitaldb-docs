<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 166" width="900" height="166" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="166" fill="#f8fafc" rx="10"/>

  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Type B — Null Modem (Cross Gender) Adapter Connection</text>

  <!-- Device Box -->
  <rect x="20" y="50" width="130" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Medical Device</text>
  <text x="85" y="93" text-anchor="middle" font-size="10" fill="#1e40af">serial port</text>

  <!-- Arrow 1 -->
  <line x1="153" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="200,75 210,80 200,85" fill="#64748b"/>

  <!-- Null Modem Adapter Box -->
  <rect x="215" y="50" width="150" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Null Modem Adapter</text>
  <text x="290" y="89" text-anchor="middle" font-size="10" fill="#991b1b">M/F or F/F Cross Gender</text>
  <text x="290" y="103" text-anchor="middle" font-size="9" fill="#991b1b">(Pin 2↔3 swapped)</text>

  <!-- Arrow 2 -->
  <line x1="368" y1="80" x2="415" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="415,75 425,80 415,85" fill="#64748b"/>
  <text x="396" y="70" text-anchor="middle" font-size="9" fill="#64748b">Direct</text>
  <text x="396" y="60" text-anchor="middle" font-size="9" fill="#64748b">Serial Cable</text>

  <!-- Direct Cable Box -->
  <rect x="430" y="50" width="130" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="495" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Direct Serial</text>
  <text x="495" y="89" text-anchor="middle" font-size="10" fill="#15803d">Cable</text>
  <text x="495" y="103" text-anchor="middle" font-size="9" fill="#15803d">(standard)</text>

  <!-- Arrow 3 -->
  <line x1="563" y1="80" x2="610" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="610,75 620,80 610,85" fill="#64748b"/>
  <text x="591" y="70" text-anchor="middle" font-size="9" fill="#64748b">USB</text>

  <!-- USB Converter Box -->
  <rect x="625" y="50" width="130" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="690" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">USB-Serial</text>
  <text x="690" y="89" text-anchor="middle" font-size="10" fill="#92400e">Converter</text>

  <!-- Arrow 4 -->
  <line x1="758" y1="80" x2="800" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="800,75 810,80 800,85" fill="#64748b"/>

  <!-- PC Box -->
  <rect x="815" y="50" width="70" height="60" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="850" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">PC</text>
  <text x="850" y="93" text-anchor="middle" font-size="9" fill="#7e22ce">Vital Rec.</text>

  <!-- Devices using this type -->
  <text x="450" y="140" text-anchor="middle" font-size="10" fill="#475569">✅ Used by: GE CARESCAPE, Drager Perseus/Flow-i, Edwards (most), Deltex CardioQ, LiDCO, Nihon Kohden BSM,</text>
  <text x="450" y="153" text-anchor="middle" font-size="10" fill="#475569">Drager Fabius with a male COM1 connector (manufactured before October 2004) — later Fabius units use a direct cable</text>
</svg>
